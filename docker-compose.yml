version: '3.9'

services:
  # ── Web Parser API + Frontend ─────────────────────────────────────
  app:
    build: .
    container_name: web-parser-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/webparser
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-please}
      - JWT_EXPIRES_IN=7d
      - LOG_LEVEL=info
      - PUPPETEER_HEADLESS=true
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - parser-net

  # ── Queue Worker (separate process) ──────────────────────────────
  worker:
    build: .
    container_name: web-parser-worker
    restart: unless-stopped
    command: node src/queue/workers/parser.worker.js
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/webparser
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAX_CONCURRENT_TASKS=3
      - MAX_CONCURRENT_DYNAMIC_TASKS=1
      - PUPPETEER_HEADLESS=true
    depends_on:
      - app
      - mongo
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - parser-net

  # ── MongoDB ───────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: web-parser-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parser-net

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: web-parser-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - parser-net

volumes:
  mongo-data:
  redis-data:

networks:
  parser-net:
    driver: bridge
